# freebsd-mokka: compact Mokka-inspired prompt

add_newline = false
command_timeout = 1000
format = "$username$hostname in $directory$git_branch$git_status$cmd_duration$line_break$character"

[username]
style_user = "bold #e8e3da"
style_root = "bold #c76b61"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "bold #b47750"
format = "[@$hostname]($style)"

[directory]
style = "bold #c49a75"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
format = " [$symbol$branch]($style)"
symbol = " "
style = "bold #b58b68"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "#d6a477"

[cmd_duration]
min_time = 1500
format = " [$duration]($style)"
style = "#8f8175"

[character]
success_symbol = "[ -#](bold #b47750)"
error_symbol = "[ -#](bold #c76b61)"
vimcmd_symbol = "[ -#](bold #a8a08e)"
